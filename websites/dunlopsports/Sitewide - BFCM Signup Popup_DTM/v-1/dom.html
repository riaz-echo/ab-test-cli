                        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

                        <script type="text/javascript">
                            const brandContent = {
                                srixon: {
                                    name: "Srixon",
                                    label: "SRIXON",
                                    subheader: "BE IN THE KNOW FOR ALL THINGS SRIXON",
                                },
                                cleveland: {
                                    name: "Cleveland Golf",
                                    label: "CLEVELAND GOLF",
                                    subheader: "BE IN THE KNOW FOR ALL THINGS CLEVELAND GOLF",
                                },
                                xxio: {
                                    name: "XXIO",
                                    label: "XXIO",
                                    subheader: "BE IN THE KNOW FOR ALL THINGS XXIO",
                                },
                            };

                            $(document).ready(() => {
                                const brandContent = {
                                    srixon: {
                                        name: "Srixon",
                                        subheader: "BE IN THE KNOW FOR ALL THINGS SRIXON",
                                    },
                                    cleveland: {
                                        name: "Cleveland Golf",
                                        subheader: "BE IN THE KNOW FOR ALL THINGS CLEVELAND GOLF",
                                    },
                                    xxio: {
                                        name: "XXIO",
                                        subheader: "BE IN THE KNOW FOR ALL THINGS XXIO",
                                    },
                                };

                                const brand = document.body.classList.contains("cleveland_golf_branding") ? "cleveland" : document.body.classList.contains("xxio_branding") ? "xxio" : "srixon";

                                const subheaderEl = document.querySelector("[data-brand-text]");
                                const nameEl = document.querySelector("[data-brand-name]");

                                if (subheaderEl) {
                                    subheaderEl.innerText = brandContent[brand].subheader;
                                }

                                if (nameEl) {
                                    nameEl.innerText = brandContent[brand].name;
                                }

                                const brandform = {
                                    srixon: "fieldCaptureForm1srixon",
                                    cleveland: "fieldCaptureForm1cleveland",
                                    xxio: "fieldCaptureForm1xxio",
                                };

                                // =========================
                                // Form 1 submit
                                // =========================
                                $("#fieldCaptureForm1").submit(function (e) {
                                    e.preventDefault();
                                    e.stopPropagation();

                                    const data = {};

                                    $(this)
                                        .serializeArray()
                                        .forEach((obj) => {
                                            data[obj.name] = obj.value;
                                        });

                                    $(this)
                                        .find("input[type=checkbox]")
                                        .each(function () {
                                            data[$(this).attr("name")] = $(this).prop("checked");
                                        });

                                    data["form"] = brandform[brand];

                                    console.log(`this form will be submitted to ${data["form"]}`);

                                    console.log(data);

                                    $.ajax({
                                        type: "POST",
                                        url: "https://cloud.email.dunlopsports.com/OptInJSON",
                                        data: data,
                                        success: function (resp) {
                                            if (resp.status === "OK") {
                                                $(".form-1").animate({opacity: "0.0"}, 100).removeClass("bring-to-front");

                                                $(".form-2").animate({opacity: "1.0"}, 100).addClass("bring-to-front");
                                            }
                                        },
                                        error: function (err) {
                                            console.log("ERROR:", err);
                                        },
                                    });
                                });

                                // =========================
                                // Form 2 submit
                                // =========================
                                $("#fieldCaptureForm2").submit(function (e) {
                                    e.preventDefault();
                                    e.stopPropagation();

                                    const data = {};

                                    $("#fieldCaptureForm2")
                                        .serializeArray()
                                        .forEach((obj) => {
                                            data[obj.name] = obj.value;
                                        });

                                    $("#fieldCaptureForm1")
                                        .serializeArray()
                                        .forEach((obj) => {
                                            data[obj.name] = obj.value;
                                        });

                                    $("#fieldCaptureForm2 input[type=checkbox]").each(function () {
                                        data[$(this).attr("name")] = $(this).prop("checked");
                                    });

                                    data["form"] = "fieldCaptureForm2";

                                    $.ajax({
                                        type: "POST",
                                        url: "https://cloud.email.dunlopsports.com/OptInJSON",
                                        data: data,
                                        success: function (resp) {
                                            if (resp.status === "OK") {
                                                $(".form-2").animate({opacity: "0.0"}, 100).removeClass("bring-to-front");

                                                $(".form-3").animate({opacity: "1.0"}, 100).addClass("bring-to-front");
                                            }
                                        },
                                        error: function (err) {
                                            console.log("AJAX ERROR:", err);
                                        },
                                    });
                                });
                            });
                        </script>
